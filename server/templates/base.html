<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Zamunda Archive{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #0a0a0f;
  --surface:   #111118;
  --surface2:  #1a1a24;
  --border:    #2a2a3a;
  --accent:    #e8c547;
  --accent2:   #4af0a0;
  --text:      #e8e8f0;
  --muted:     #6b6b88;
  --danger:    #f05a5a;
  --radius:    8px;
  --font:      'Syne', sans-serif;
  --mono:      'JetBrains Mono', monospace;
}
[data-theme="light"] {
  --bg:       #f4f4f0;
  --surface:  #ffffff;
  --surface2: #ebebeb;
  --border:   #d0d0d8;
  --text:     #1a1a2e;
  --muted:    #888899;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}
a { color: var(--accent); text-decoration: none; }
a:hover { opacity: 0.8; }
button, .btn {
  font-family: var(--font);
  cursor: pointer;
  border: none;
  border-radius: var(--radius);
  padding: 0.5rem 1.1rem;
  font-size: 0.85rem;
  font-weight: 600;
  transition: all 0.15s;
}
.btn-primary {
  background: var(--accent);
  color: #0a0a0f;
}
.btn-primary:hover { filter: brightness(1.1); }
.btn-ghost {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-ghost:hover { background: var(--surface2); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { filter: brightness(1.1); }
.btn-sm { padding: 0.3rem 0.7rem; font-size: 0.78rem; }

/* Nav */
nav {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 1.5rem;
  display: flex;
  align-items: center;
  gap: 1.5rem;
  height: 54px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.nav-logo {
  font-size: 1.1rem;
  font-weight: 800;
  color: var(--accent);
  letter-spacing: -0.5px;
  white-space: nowrap;
}
.nav-logo span { color: var(--text); }
.nav-spacer { flex: 1; }
.nav-link {
  color: var(--muted);
  font-size: 0.85rem;
  font-weight: 600;
  padding: 0.3rem 0.6rem;
  border-radius: 6px;
  transition: all 0.15s;
}
.nav-link:hover, .nav-link.active { color: var(--text); background: var(--surface2); opacity: 1; }
.nav-user {
  font-size: 0.82rem;
  color: var(--muted);
  font-family: var(--mono);
}
.nav-user strong { color: var(--accent2); }

/* Layout */
.container { max-width: 1400px; margin: 0 auto; padding: 1.5rem; }
.page-header { margin-bottom: 1.5rem; }
.page-header h1 { font-size: 1.5rem; font-weight: 800; }
.page-header p { color: var(--muted); font-size: 0.85rem; margin-top: 0.2rem; }

/* Cards */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.2rem;
}

/* Forms */
input, select, textarea {
  font-family: var(--font);
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: var(--radius);
  padding: 0.5rem 0.8rem;
  font-size: 0.88rem;
  width: 100%;
  transition: border-color 0.15s;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
}
label { font-size: 0.82rem; font-weight: 600; color: var(--muted); display: block; margin-bottom: 0.3rem; }
.form-group { margin-bottom: 1rem; }

/* Badge */
.badge {
  display: inline-block;
  font-size: 0.7rem;
  font-weight: 700;
  padding: 0.15rem 0.45rem;
  border-radius: 4px;
  font-family: var(--mono);
}
.badge-green { background: rgba(74,240,160,0.15); color: var(--accent2); }
.badge-yellow { background: rgba(232,197,71,0.15); color: var(--accent); }
.badge-gray { background: var(--surface2); color: var(--muted); }
.badge-red { background: rgba(240,90,90,0.15); color: var(--danger); }

/* Toast */
#toast {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.8rem 1.2rem;
  font-size: 0.85rem;
  z-index: 9999;
  opacity: 0;
  transform: translateY(8px);
  transition: all 0.2s;
  pointer-events: none;
}
#toast.show { opacity: 1; transform: translateY(0); }
#toast.success { border-color: var(--accent2); color: var(--accent2); }
#toast.error { border-color: var(--danger); color: var(--danger); }

/* Modal */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 500;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s;
}
.modal-backdrop.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.5rem;
  width: min(600px, 95vw);
  max-height: 90vh;
  overflow-y: auto;
  transform: translateY(12px);
  transition: transform 0.2s;
}
.modal-backdrop.open .modal { transform: translateY(0); }
.modal-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.2rem; gap: 1rem; }
.modal-header h2 { font-size: 1.1rem; font-weight: 700; line-height: 1.3; }
.modal-close { background: none; border: none; color: var(--muted); font-size: 1.3rem; cursor: pointer; padding: 0; line-height: 1; flex-shrink: 0; }
.modal-close:hover { color: var(--text); }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* Responsive */
@media (max-width: 640px) {
  nav { padding: 0 1rem; gap: 0.8rem; }
  .container { padding: 1rem; }
}
</style>
</head>
<body>
<nav>
  <div class="nav-logo">Z<span>Archive</span></div>
  {% if user %}
    <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}" id="nav-browse" data-i18n="nav_browse">Browse</a>
    {% if user['is_admin'] %}
    <a href="/admin" class="nav-link {% if request.path == '/admin' %}active{% endif %}" id="nav-admin" data-i18n="nav_admin">Admin</a>
    {% endif %}
    <div class="nav-spacer"></div>
    <span class="nav-user" data-i18n-template="nav_user" data-i18n-var="{{ user['username'] }}"></span>
    <a href="/settings" class="nav-link {% if request.path == '/settings' %}active{% endif %}" id="nav-settings" data-i18n="nav_settings">Settings</a>
    <button class="btn btn-ghost btn-sm" onclick="logout()" id="nav-logout" data-i18n="nav_logout">Logout</button>
  {% else %}
    <div class="nav-spacer"></div>
    <a href="/login" class="nav-link" data-i18n="nav_login">Login</a>
    <a href="/register" class="btn btn-primary btn-sm" data-i18n="nav_register">Register</a>
  {% endif %}
</nav>

{% block content %}{% endblock %}

<div id="toast"></div>

<script>
// ── i18n ──────────────────────────────────────────────────────────────────────
const STRINGS = {
  en: {
    nav_browse:"Browse", nav_admin:"Admin", nav_settings:"Settings",
    nav_logout:"Logout", nav_login:"Login", nav_register:"Register",
    nav_user:"Logged in as {0}",
  },
  bg: {
    nav_browse:"Преглед", nav_admin:"Админ", nav_settings:"Настройки",
    nav_logout:"Изход", nav_login:"Вход", nav_register:"Регистрация",
    nav_user:"Влезли сте като {0}",
  }
};
let currentLang = localStorage.getItem("lang") || "en";
let currentTheme = localStorage.getItem("theme") || "dark";

function applyTheme(t) {
  currentTheme = t;
  document.documentElement.setAttribute("data-theme", t);
  localStorage.setItem("theme", t);
}
function applyLang(l) {
  currentLang = l;
  localStorage.setItem("lang", l);
  const s = STRINGS[l] || STRINGS.en;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (s[key]) el.textContent = s[key];
  });
  document.querySelectorAll("[data-i18n-template]").forEach(el => {
    const key = el.getAttribute("data-i18n-template");
    const v   = el.getAttribute("data-i18n-var") || "";
    if (s[key]) el.textContent = s[key].replace("{0}", v);
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
    const key = el.getAttribute("data-i18n-placeholder");
    if (s[key]) el.placeholder = s[key];
  });
}
applyTheme(currentTheme);
applyLang(currentLang);

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, type="success") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "show " + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = "", 3000);
}

// ── Logout ────────────────────────────────────────────────────────────────────
async function logout() {
  await fetch("/api/logout", {method:"POST"});
  location.href = "/login";
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
